<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test API Mobile Alerts</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen p-8 font-sans">
    <div class="max-w-2xl mx-auto bg-slate-800 p-8 rounded-xl shadow-xl border border-slate-700">
        <h2 class="text-2xl font-bold mb-2 text-blue-400">Simulator Aplikasi Mobile (Flutter)</h2>
        <p class="text-slate-400 text-sm mb-6">Mengecek endpoint <code class="text-emerald-400 bg-slate-900 px-2 py-1 rounded">/api/mobile/v1/alerts/active</code></p>

        <div class="space-y-4 mb-6">
            <div>
                <label class="block text-xs font-bold text-slate-400 uppercase mb-2">API Token User</label>
                <input type="text" id="apiToken" placeholder="Masukkan token otorisasi dari database tabel users..." 
                       class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-3 outline-none focus:border-blue-500 text-sm">
            </div>
            
            <button onclick="fetchAlerts()" class="w-full bg-blue-500 hover:bg-blue-400 text-white font-bold py-3 px-4 rounded-lg transition shadow-lg">
                Tarik Data Notifikasi (GET Request)
            </button>
        </div>

        <div>
            <label class="block text-xs font-bold text-slate-400 uppercase mb-2">Response JSON</label>
            <div class="bg-slate-900 rounded-lg border border-slate-700 overflow-hidden">
                <pre id="jsonResult" class="p-4 text-xs text-emerald-400 overflow-x-auto whitespace-pre-wrap min-h-[200px]">Data akan muncul di sini...</pre>
            </div>
        </div>
    </div>

    <script>
        async function fetchAlerts() {
            const tokenInput = document.getElementById('apiToken').value.trim();
            const resultBox = document.getElementById('jsonResult');

            if (!tokenInput) {
                resultBox.innerHTML = '<span class="text-rose-500">Error: Harap masukkan API Token!</span>';
                return;
            }

            resultBox.textContent = "Loading...";

            try {
                // Endpoint dipanggil relatif dari localhost:3000
                const response = await fetch('/api/mobile/v1/alerts/active', {
                    method: 'GET',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${tokenInput}`
                    }
                });

                const data = await response.json();
                
                // Format output JSON agar rapi
                if (response.ok) {
                    resultBox.innerHTML = `<span class="${data.total_active > 0 ? 'text-rose-400' : 'text-emerald-400'}">${JSON.stringify(data, null, 4)}</span>`;
                } else {
                    resultBox.innerHTML = `<span class="text-amber-400">Response Error (${response.status}):\n${JSON.stringify(data, null, 4)}</span>`;
                }
            } catch (error) {
                resultBox.innerHTML = `<span class="text-rose-500">Network Error:\n${error.message}</span>`;
            }
        }
    </script>
</body>
</html>
